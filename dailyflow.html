<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DailyFlow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #FBF8F4; }
.block { transition: box-shadow .15s ease; user-select: none; touch-action: none; }
.block:active { cursor: grabbing !important; }
.block .ctrl { opacity: 0; transition: opacity .15s; }
.block:hover .ctrl, .block.selected .ctrl { opacity: 1; }
input[type="time"]::-webkit-calendar-picker-indicator { opacity:.4; }
::selection { background:#FDE2E4; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #DDD0C5; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

const SUPABASE_URL = "https://ksbzojvwjeinyhibpyxd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYnpvanZ3amVpbnloaWJweXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4OTAyOTIsImV4cCI6MjA5NjQ2NjI5Mn0.d-a1UCcGXAyTtOFsQ7C38J_17h1OmgNJkv3gp8vTxio";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PALETTE = [
  { bg: "#FDE2E4", bar: "#E76F87", text: "#7A2B3D" },
  { bg: "#E2ECE9", bar: "#5BA199", text: "#234D47" },
  { bg: "#E6E0F8", bar: "#8366C9", text: "#3C2D6B" },
  { bg: "#FFF1D6", bar: "#E0A341", text: "#7A551A" },
  { bg: "#DCE8FB", bar: "#5B8DEF", text: "#1F3F73" },
  { bg: "#E4F3E0", bar: "#6BAE4F", text: "#2E5320" },
];
const PRIORITY = {
  high: { label: "高", color: "#E76F87" },
  mid:  { label: "中", color: "#E0A341" },
  low:  { label: "低", color: "#5BA199" },
};
const DURATION_RULES = [
  { kw: ["会議","ミーティング","mtg","面談","打ち合わせ","打合せ"], min: 60 },
  { kw: ["メール","返信","チェック","確認"], min: 20 },
  { kw: ["作曲","アレンジ","編曲","制作","ミックス","mix"], min: 120 },
  { kw: ["執筆","記事","ブログ","ライティング","台本","原稿"], min: 90 },
  { kw: ["勉強","学習","韓国語","リスニング","インプット"], min: 50 },
  { kw: ["設計","開発","コーディング","実装","デバッグ"], min: 90 },
  { kw: ["昼食","ランチ","食事","休憩","休息"], min: 45 },
  { kw: ["運動","ジム","散歩","ランニング"], min: 60 },
  { kw: ["買い物","掃除","洗濯","家事"], min: 30 },
  { kw: ["電話","tel","連絡"], min: 15 },
  { kw: ["資料","提案","企画","プラン","設計書"], min: 75 },
];
const NO_POMO = ["昼食","ランチ","食事","休憩","休息","運動","ジム","散歩"];

// タイムライン基準: 7:00始まり = 420分。以降420〜1860(翌7:00)で表現。
const TL_START = 420;      // 07:00
const TL_END = 420 + 1440; // 翌07:00 = 1860

function estimateDuration(title) {
  const t = title.toLowerCase();
  for (const rule of DURATION_RULES)
    if (rule.kw.some(k => t.includes(k.toLowerCase()))) return { min: rule.min, auto: true };
  return { min: title.trim().length > 18 ? 60 : 25, auto: true };
}
const isPomoTask = title => !NO_POMO.some(k => title.includes(k));
const toMin = hhmm => { const [h,m] = hhmm.split(":").map(Number); return h*60+m; };
// 通常の分(0-1439) → タイムライン座標(420-1860)。7時未満は翌日側へ。
const toTL = clockMin => clockMin < TL_START ? clockMin + 1440 : clockMin;
const toHHMM = tlMin => { const c=((tlMin%1440)+1440)%1440; const h=Math.floor(c/60), m=c%60; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; };
const fmtDur = min => { const h=Math.floor(min/60),m=min%60; if(h&&m) return `${h}時間${m}分`; if(h) return `${h}時間`; return `${m}分`; };
let _id = Date.now();
const uid = () => `t${_id++}`;

function DailyFlow() {
  const [tasks, setTasks] = useState([]);
  const [pomo, setPomo] = useState({ focus:25, short:5, long:30, cycle:4 });
  const [windows, setWindows] = useState([{ start:"09:00", end:"18:00" }]);
  const [newTitle, setNewTitle] = useState("");
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState("");
  const [timer, setTimer] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [tab, setTab] = useState("timeline"); // edit | timeline | later
  const [isComposing, setIsComposing] = useState(false);
  const saveTimer = useRef(null);

  const [isMobile, setIsMobile] = useState(window.innerWidth < 860);
  useEffect(() => {
    const h = () => setIsMobile(window.innerWidth < 860);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);

  const pomoLayout = useCallback((durationMin) => {
    const { focus, short, long, cycle } = pomo;
    const segs = []; let remaining = durationMin, cursor = 0, pomoCount = 0;
    while (remaining > 0) {
      const work = Math.min(focus, remaining);
      segs.push({ type:"focus", start:cursor, len:work });
      cursor += work; remaining -= work; pomoCount += 1;
      if (remaining > 0) {
        const isLong = pomoCount % cycle === 0;
        const brk = isLong ? long : short;
        segs.push({ type: isLong?"long":"short", start:cursor, len:brk });
        cursor += brk;
      }
    }
    return { segs, total:cursor, pomoCount };
  }, [pomo]);
  const occupiedLen = useCallback(t => t.usePomo ? pomoLayout(t.duration).total : t.duration, [pomoLayout]);

  useEffect(() => {
    (async () => {
      try {
        const [{ data: taskData }, { data: settData }] = await Promise.all([
          sb.from("tasks").select("*").order("created_at"),
          sb.from("settings").select("*").eq("id","default").single(),
        ]);
        if (taskData) {
          setTasks(taskData.map(r => ({
            id: r.id, title: r.title, priority: r.priority,
            duration: r.duration, autoDuration: r.auto_duration,
            fixed: r.fixed, fixedStart: r.fixed_start,
            usePomo: r.use_pomo, color: r.color,
            done: r.done, placedStart: r.placed_start,
            lane: r.lane || 0, status: r.status || "today",
          })));
        }
        if (settData) {
          if (settData.pomo) setPomo({ focus:25, short:5, long:30, cycle:4, ...settData.pomo });
          if (settData.windows) setWindows(settData.windows);
        }
      } catch(e) { console.error(e); }
      setLoading(false);
    })();
  }, []);

  const autoSave = useCallback(async (newTasks, newPomo, newWindows) => {
    setSaveStatus("saving");
    try {
      if (newTasks.length > 0) {
        await sb.from("tasks").upsert(newTasks.map(t => ({
          id: t.id, title: t.title, priority: t.priority,
          duration: t.duration, auto_duration: t.autoDuration,
          fixed: t.fixed, fixed_start: t.fixedStart,
          use_pomo: t.usePomo, color: t.color,
          done: t.done, placed_start: t.placedStart, lane: t.lane||0, status: t.status||"today",
        })));
        const ids = newTasks.map(t => t.id);
        const { data: dbTasks } = await sb.from("tasks").select("id");
        if (dbTasks) {
          const toDelete = dbTasks.map(r=>r.id).filter(id => !ids.includes(id));
          if (toDelete.length > 0) await sb.from("tasks").delete().in("id", toDelete);
        }
      } else {
        await sb.from("tasks").delete().neq("id","__none__");
      }
      await sb.from("settings").upsert({ id:"default", pomo: newPomo, windows: newWindows, updated_at: new Date().toISOString() });
      setSaveStatus("saved");
    } catch(e) { console.error(e); setSaveStatus("error"); }
  }, []);
  const triggerSave = useCallback((t, p, w) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => autoSave(t, p, w), 1200);
  }, [autoSave]);
  const setTasksAndSave = useCallback(updater => {
    setTasks(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      triggerSave(next, pomo, windows);
      return next;
    });
  }, [pomo, windows, triggerSave]);
  const setPomoAndSave = v => { setPomo(v); triggerSave(tasks, v, windows); };
  const setWindowsAndSave = v => { setWindows(v); triggerSave(tasks, pomo, v); };

  // 稼働時間帯（タイムライン座標）
  const windowBands = useMemo(()=>windows
    .map(w=>({s:toTL(toMin(w.start)),e:toTL(toMin(w.end))}))
    .map(w=>w.e<=w.s?{s:w.s,e:w.e+1440}:w) // 終了が開始以下なら日跨ぎ
    .filter(w=>w.e>w.s)
    .sort((a,b)=>a.s-b.s),[windows]);

  // ===== 新規タスクを稼働時間帯の末尾に積む（枠を超えても必ず配置） =====
  const nextSlotStart = useCallback((currentTasks, need) => {
    if (!windowBands.length) return TL_START;
    const placed = currentTasks.filter(t=>t.status==="today"&&t.placedStart!==null&&!t.done&&(t.lane||0)===0)
      .map(t=>({s:t.placedStart,e:t.placedStart+occupiedLen(t)}));
    // 各稼働枠で空きを探す
    for (const w of windowBands) {
      let cursor = w.s;
      const inWin = placed.filter(p=>p.e>w.s&&p.s<w.e).sort((a,b)=>a.s-b.s);
      inWin.forEach(p=>{ if(p.e>cursor) cursor = Math.max(cursor,p.e); });
      if (cursor + need <= w.e) return cursor;
    }
    // 枠に収まらない場合：全既存タスクの最後尾（なければ最初の枠の頭）に連続配置
    if (placed.length > 0) {
      return Math.max(...placed.map(p=>p.e));
    }
    return windowBands[0].s;
  }, [windowBands, occupiedLen]);

  const addTask = (status="today") => {
    const title = newTitle.trim();
    if (!title) return;
    const est = estimateDuration(title);
    const base = { id:uid(), title, priority:"mid", duration:est.min, autoDuration:est.auto, fixed:false, fixedStart:null, usePomo:isPomoTask(title), color:tasks.length%PALETTE.length, done:false, lane:0, status };
    if (status==="later") {
      setTasksAndSave(p => [...p, {...base, placedStart:null}]);
    } else {
      const need = est.auto ? (isPomoTask(title)?pomoLayout(est.min).total:est.min) : est.min;
      const slot = nextSlotStart(tasks, need);
      setTasksAndSave(p => [...p, {...base, placedStart: slot}]);
    }
    setNewTitle("");
  };
  const updateTask = (id, patch) => setTasksAndSave(p => p.map(t => t.id===id ? {...t,...patch} : t));
  const removeTask = id => { setTasksAndSave(p => p.filter(t => t.id!==id)); if(selectedId===id) setSelectedId(null); };

  // later → today（末尾に配置） / today → later（配置解除）
  const moveToToday = id => setTasksAndSave(p=>{
    const t = p.find(x=>x.id===id); if(!t) return p;
    const need = occupiedLen(t);
    const slot = nextSlotStart(p, need);
    return p.map(x=>x.id===id?{...x,status:"today",placedStart:slot}:x);
  });
  const moveToLater = id => setTasksAndSave(p=>p.map(x=>x.id===id?{...x,status:"later",placedStart:null,lane:0}:x));

  const PX = isMobile ? 1.2 : 1.5;
  const timelineH = 1440 * PX;
  const ticks = useMemo(()=>{ const out=[]; for(let i=0;i<=24;i++) out.push(TL_START+i*60); return out; },[]);
  const placedTasks = useMemo(()=>tasks.filter(t=>t.status==="today"&&t.placedStart!==null&&!t.done).sort((a,b)=>a.placedStart-b.placedStart),[tasks]);
  const todayTasks = useMemo(()=>tasks.filter(t=>t.status==="today"),[tasks]);
  const laterTasks = useMemo(()=>tasks.filter(t=>t.status==="later"),[tasks]);
  const unplaced = useMemo(()=>tasks.filter(t=>t.status==="today"&&t.placedStart===null&&!t.done),[tasks]);

  const conflicts = useMemo(()=>{
    const set=new Set();
    for(let i=0;i<placedTasks.length;i++) for(let j=i+1;j<placedTasks.length;j++){
      const a=placedTasks[i],b=placedTasks[j];
      if((a.lane||0)===(b.lane||0) && a.placedStart<b.placedStart+occupiedLen(b)&&b.placedStart<a.placedStart+occupiedLen(a)){set.add(a.id);set.add(b.id);}
    }
    return set;
  }, [placedTasks, occupiedLen]);
  const maxLane = useMemo(()=>Math.max(0,...placedTasks.map(t=>t.lane||0)),[placedTasks]);
  const laneCount = maxLane + 1;
  const totalPomos = useMemo(()=>todayTasks.filter(t=>!t.done&&t.usePomo).reduce((s,t)=>s+pomoLayout(t.duration).pomoCount,0),[todayTasks,pomoLayout]);
  const capacity = useMemo(()=>windowBands.reduce((s,w)=>s+(w.e-w.s),0),[windowBands]);
  const totalMin = useMemo(()=>todayTasks.filter(t=>!t.done).reduce((s,t)=>s+occupiedLen(t),0),[todayTasks,occupiedLen]);

  const drag = useRef(null);
  const onDown = (e,t) => {
    e.preventDefault(); setSelectedId(t.id);
    const y = e.touches?e.touches[0].clientY:e.clientY;
    drag.current={id:t.id,startY:y,orig:t.placedStart};
    window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMove,{passive:false});window.addEventListener("touchend",onUp);
  };
  const onMove = e => {
    if(!drag.current) return;
    if(e.cancelable) e.preventDefault();
    const y=e.touches?e.touches[0].clientY:e.clientY;
    const d=Math.round((y-drag.current.startY)/PX);
    let ns=Math.max(TL_START,Math.min(TL_END-5,drag.current.orig+d));
    updateTask(drag.current.id,{placedStart:ns});
  };
  const onUp = () => {
    if(drag.current){
      const id=drag.current.id;
      setTasksAndSave(p=>p.map(t=>{
        if(t.id!==id||t.placedStart===null) return t;
        let s=t.placedStart; const need=occupiedLen(t);
        if(s+need>TL_END) s=TL_END-need;
        return {...t,placedStart:Math.max(TL_START,s)};
      }));
    }
    drag.current=null;
    window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);
    window.removeEventListener("touchmove",onMove);window.removeEventListener("touchend",onUp);
  };
  const nudge = (id, delta) => setTasksAndSave(p=>p.map(t=>{
    if(t.id!==id||t.placedStart===null) return t;
    const need=occupiedLen(t);
    let s=Math.max(TL_START,Math.min(TL_END-need,t.placedStart+delta));
    return {...t,placedStart:s};
  }));
  const setLane = (id, lane) => setTasksAndSave(p=>p.map(t=>t.id===id?{...t,lane}:t));

  const nowMin = useMemo(()=>{const d=new Date();return toTL(d.getHours()*60+d.getMinutes());},[]);

  const startTimer = t => setTimer({taskId:t.id,title:t.title,phase:"focus",secs:pomo.focus*60,total:pomo.focus*60,pomoDone:0,paused:false});
  useEffect(()=>{
    if(!timer||timer.paused) return;
    const iv=setInterval(()=>{
      setTimer(tm=>{
        if(!tm||tm.paused) return tm;
        if(tm.secs>1) return{...tm,secs:tm.secs-1};
        if(tm.phase==="focus"){
          const done=tm.pomoDone+1,isLong=done%pomo.cycle===0,len=(isLong?pomo.long:pomo.short)*60;
          return{...tm,phase:isLong?"long":"short",secs:len,total:len,pomoDone:done};
        }
        return{...tm,phase:"focus",secs:pomo.focus*60,total:pomo.focus*60};
      });
    },1000);
    return()=>clearInterval(iv);
  },[timer,pomo]);

  const onTitleKeyDown = e => {
    if (e.key !== "Enter") return;
    if (isComposing || e.nativeEvent.isComposing) return;
    addTask("today");
  };

  if (loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16,fontFamily:"'Zen Maru Gothic',sans-serif",color:"#B79C92"}}>
      <div style={{fontSize:48}}>🍅</div><div style={{fontSize:16}}>DailyFlow を読み込み中...</div>
    </div>
  );

  const EditPanel = (
    <section style={S.panel}>
      <h2 style={S.h2}>🍅 ポモドーロ設定</h2>
      <div style={S.pomoGrid}>
        <PomoField label="集中" unit="分" val={pomo.focus} set={v=>setPomoAndSave({...pomo,focus:v})}/>
        <PomoField label="小休憩" unit="分" val={pomo.short} set={v=>setPomoAndSave({...pomo,short:v})}/>
        <PomoField label="長休憩" unit="分" val={pomo.long} set={v=>setPomoAndSave({...pomo,long:v})}/>
        <PomoField label="長休憩まで" unit="回" val={pomo.cycle} set={v=>setPomoAndSave({...pomo,cycle:v})}/>
      </div>
      <div style={S.presetRow}>
        <span style={{fontSize:12,color:"#A99B92"}}>プリセット:</span>
        <button style={S.preset} onClick={()=>setPomoAndSave({focus:25,short:5,long:30,cycle:4})}>クラシック 25/5</button>
        <button style={S.preset} onClick={()=>setPomoAndSave({focus:50,short:10,long:20,cycle:2})}>集中型 50/10</button>
        <button style={S.preset} onClick={()=>setPomoAndSave({focus:90,short:20,long:30,cycle:2})}>ディープ 90/20</button>
      </div>
      <h2 style={{...S.h2,marginTop:24}}>稼働できる時間帯</h2>
      <p style={S.note}>この時間帯にタスクが自動で積まれます。7:00より前は翌日として扱われます。</p>
      {windows.map((w,i)=>(
        <div key={i} style={S.winRow}>
          <input type="time" value={w.start} onChange={e=>setWindowsAndSave(windows.map((x,j)=>j===i?{...x,start:e.target.value}:x))} style={S.timeInput}/>
          <span style={S.tilde}>—</span>
          <input type="time" value={w.end} onChange={e=>setWindowsAndSave(windows.map((x,j)=>j===i?{...x,end:e.target.value}:x))} style={S.timeInput}/>
          {windows.length>1&&<button style={S.iconBtn} onClick={()=>setWindowsAndSave(windows.filter((_,j)=>j!==i))}>✕</button>}
        </div>
      ))}
      <button style={S.ghostBtn} onClick={()=>setWindowsAndSave([...windows,{start:"19:00",end:"21:00"}])}>＋ 時間帯を追加</button>
    </section>
  );

  const AddBar = (
    <div style={S.addRow}>
      <input value={newTitle}
        onChange={e=>setNewTitle(e.target.value)}
        onCompositionStart={()=>setIsComposing(true)}
        onCompositionEnd={()=>setIsComposing(false)}
        onKeyDown={onTitleKeyDown}
        placeholder="タスクを入力（Enterで今日に追加）" style={S.textInput}/>
      <button style={S.addBtn} onClick={()=>addTask("today")}>今日に追加</button>
      <button style={S.addLaterBtn} onClick={()=>addTask("later")}>あとで</button>
    </div>
  );

  const TimelinePanel = (
    <section style={S.panel}>
      <div style={S.tlHeader}>
        <h2 style={S.h2}>📅 今日のタイムライン</h2>
        <span style={S.hint}>{isMobile?"タップで選択→±で微調整":"ドラッグ/±で再配置・▶で集中"}</span>
      </div>
      {AddBar}
      {selectedId&&(()=>{
        const t=tasks.find(x=>x.id===selectedId);
        if(!t||t.placedStart===null) return null;
        return (
          <div style={S.adjustBar}>
            <span style={S.adjustTitle}>{t.title}</span>
            <div style={S.adjustRow}>
              <span style={{fontSize:11,color:"#A99B92"}}>時刻</span>
              <button style={S.adjBtn} onClick={()=>nudge(t.id,-15)}>−15</button>
              <button style={S.adjBtn} onClick={()=>nudge(t.id,-5)}>−5</button>
              <span style={S.adjVal}>{toHHMM(t.placedStart)}</span>
              <button style={S.adjBtn} onClick={()=>nudge(t.id,5)}>＋5</button>
              <button style={S.adjBtn} onClick={()=>nudge(t.id,15)}>＋15</button>
            </div>
            <div style={S.adjustRow}>
              <span style={{fontSize:11,color:"#A99B92"}}>列(同時進行)</span>
              {[0,1,2].map(l=>(
                <button key={l} style={{...S.laneBtn,background:(t.lane||0)===l?"#5BA199":"#fff",color:(t.lane||0)===l?"#fff":"#9A918C",borderColor:(t.lane||0)===l?"#5BA199":"#E5DDD5"}} onClick={()=>setLane(t.id,l)}>{l+1}列</button>
              ))}
            </div>
            <div style={S.adjustRow}>
              <button style={S.moveLaterBtn} onClick={()=>{moveToLater(t.id);setSelectedId(null);}}>→ あとでやるへ移動</button>
              <button style={S.adjClose} onClick={()=>setSelectedId(null)}>閉じる</button>
            </div>
          </div>
        );
      })()}
      <div style={S.timelineWrap}>
        <div style={{...S.timeline,height:timelineH}}>
          {/* 稼働時間帯を白く塗る */}
          {windowBands.map((w,i)=>(
            <div key={i} style={{position:"absolute",left:52,right:8,top:(w.s-TL_START)*PX,height:(w.e-w.s)*PX,background:"linear-gradient(90deg,#E9F5F1,#F3FAF7)",border:"1.5px solid #9FD3C7",borderLeft:"5px solid #5BA199",borderRadius:8,zIndex:1}}>
              <span style={S.winTag}>● 稼働時間</span>
            </div>
          ))}
          {ticks.map(m=>{
            const isNight = (m%1440)<TL_START || (m%1440)>=22*60;
            return (
              <div key={m} style={{position:"absolute",top:(m-TL_START)*PX,left:0,right:0,borderTop:"1px solid #EadFd5",zIndex:2}}>
                <span style={{...S.tickLabel,color:isNight?"#C9A8B0":"#B79C92"}}>{toHHMM(m)}</span>
              </div>
            );
          })}
          {nowMin>=TL_START&&nowMin<=TL_END&&(
            <div style={{position:"absolute",top:(nowMin-TL_START)*PX,left:46,right:8,height:2,background:"#E76F87",zIndex:7}}>
              <span style={S.nowDot}/>
            </div>
          )}
          {placedTasks.map(t=>{
            const top=(t.placedStart-TL_START)*PX;
            const p=PALETTE[t.color];
            const isConf=conflicts.has(t.id);
            const isSel=selectedId===t.id;
            const layout=t.usePomo?pomoLayout(t.duration):{segs:[{type:"focus",start:0,len:t.duration}],total:t.duration,pomoCount:0};
            const lane=t.lane||0;
            const laneW = `calc((100% - 52px - 8px) / ${laneCount})`;
            const leftCalc = `calc(52px + ${lane} * (100% - 52px - 8px) / ${laneCount})`;
            return(
              <div key={t.id} className={"block"+(isSel?" selected":"")} onMouseDown={e=>onDown(e,t)} onTouchStart={e=>onDown(e,t)}
                style={{position:"absolute",top,left:leftCalc,width:laneW,height:Math.max(layout.total*PX,28),zIndex:isSel?6:4,cursor:"grab",borderRadius:10,
                  boxShadow:isSel?`0 0 0 2px ${p.bar},0 8px 20px rgba(60,45,40,.2)`:isConf?"0 0 0 2px #E76F87,0 6px 16px rgba(231,111,135,.25)":"0 4px 12px rgba(60,45,40,.1)",overflow:"hidden",background:"#fff",marginRight:3}}>
                {layout.segs.map((seg,si)=>(
                  <div key={si} style={{position:"absolute",left:0,right:0,top:seg.start*PX,height:seg.len*PX,
                    background:seg.type==="focus"?p.bg:seg.type==="long"?"#EFEAE4":"#F5F1EC",
                    borderLeft:`4px solid ${seg.type==="focus"?p.bar:"#D8CFC6"}`,
                    borderTop:si>0?"1px dashed rgba(0,0,0,.08)":"none"}}>
                    {seg.type!=="focus"&&seg.len*PX>13&&(<span style={S.breakLabel}>☕{seg.len}分</span>)}
                  </div>
                ))}
                <div style={{position:"absolute",left:11,right:6,top:5,color:p.text}}>
                  <div style={S.blockTitle}>
                    {t.fixed&&"📌 "}{lane>0&&<span style={S.laneTag}>{lane+1}列</span>}{t.title}
                    {isConf&&<span style={S.confTag}>重複</span>}
                  </div>
                  <div style={S.blockMeta}>{toHHMM(t.placedStart)}–{toHHMM(t.placedStart+layout.total)}{t.usePomo&&layout.pomoCount>0?` ・ ポモ${layout.pomoCount}回`:""}</div>
                </div>
                {t.usePomo&&(<button className="ctrl" style={S.playBtn} onMouseDown={e=>e.stopPropagation()} onTouchStart={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();startTimer(t);}}>▶</button>)}
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );

  const LaterPanel = (
    <section style={S.panel}>
      <div style={S.tlHeader}>
        <h2 style={S.h2}>🗂 あとでやる</h2>
        <span style={S.hint}>今日はやらないがストックしておくタスク</span>
      </div>
      {AddBar}
      {laterTasks.length===0 ? (
        <div style={S.empty}><div style={{fontSize:36,marginBottom:10}}>🗂</div>あとでやるタスクはありません<br/>「あとで」ボタンで追加できます</div>
      ) : (
        <div style={S.taskList}>
          {laterTasks.map(t=>(
            <div key={t.id} style={{...S.laterCard,borderLeft:`4px solid ${PALETTE[t.color].bar}`,opacity:t.done?.5:1}}>
              <button style={{...S.check,background:t.done?PALETTE[t.color].bar:"transparent",borderColor:PALETTE[t.color].bar}} onClick={()=>updateTask(t.id,{done:!t.done})}>{t.done?"✓":""}</button>
              <div style={{flex:1,minWidth:0}}>
                <input value={t.title} onChange={e=>updateTask(t.id,{title:e.target.value})} style={{...S.cardTitle,marginBottom:4,textDecoration:t.done?"line-through":"none"}}/>
                <div style={{fontSize:11.5,color:"#A99B92"}}>目安 {fmtDur(t.duration)}{t.usePomo?` ・ ポモ${pomoLayout(t.duration).pomoCount}回`:""}</div>
              </div>
              <button style={S.toTodayBtn} onClick={()=>{moveToToday(t.id);if(isMobile)setTab("timeline");}}>今日やる →</button>
              <button style={S.del} onClick={()=>removeTask(t.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
    </section>
  );

  const TodayListPanel = (
    <section style={S.panel}>
      <div style={S.tlHeader}><h2 style={S.h2}>✏️ 今日のタスク</h2></div>
      {AddBar}
      {todayTasks.length===0 ? (
        <div style={S.empty}><div style={{fontSize:36,marginBottom:10}}>📝</div>タスクを追加してください</div>
      ) : (
        <div style={S.taskList}>
          {todayTasks.map(t=><TaskCard key={t.id} t={t} onUpdate={updateTask} onRemove={removeTask} pomoLayout={pomoLayout} onLater={()=>moveToLater(t.id)}/>)}
        </div>
      )}
    </section>
  );

  return (
    <div style={S.root}>
      <header style={S.header}>
        <div>
          <div style={S.kicker}>DAILY ORCHESTRATION · POMODORO</div>
          <h1 style={S.title}>Daily<span style={{color:"#E76F87"}}>Flow</span></h1>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          <div style={S.statBar}>
            <Stat label="今日" value={todayTasks.filter(t=>!t.done).length}/>
            <Stat label="あとで" value={laterTasks.filter(t=>!t.done).length}/>
            <Stat label="ポモ" value={totalPomos+"回"}/>
            <Stat label="占有" value={fmtDur(totalMin)} warn={totalMin>capacity}/>
            <Stat label="稼働枠" value={fmtDur(capacity)}/>
          </div>
          <div style={S.saveStatus}>
            {saveStatus==="saving"&&<span style={{color:"#B79C92"}}>⟳ 保存中...</span>}
            {saveStatus==="saved"&&<span style={{color:"#5BA199"}}>✓ クラウド保存済み</span>}
            {saveStatus==="error"&&<span style={{color:"#E76F87"}}>✕ 保存エラー</span>}
          </div>
        </div>
      </header>

      <div style={S.tabBar}>
        <button style={{...S.tabBtn,...(tab==="timeline"?S.tabActive:{})}} onClick={()=>setTab("timeline")}>📅 タイムライン</button>
        {isMobile&&<button style={{...S.tabBtn,...(tab==="today"?S.tabActive:{})}} onClick={()=>setTab("today")}>✏️ 今日</button>}
        <button style={{...S.tabBtn,...(tab==="later"?S.tabActive:{})}} onClick={()=>setTab("later")}>🗂 あとでやる{laterTasks.length>0?`(${laterTasks.filter(t=>!t.done).length})`:""}</button>
        <button style={{...S.tabBtn,...(tab==="edit"?S.tabActive:{})}} onClick={()=>setTab("edit")}>⚙️ 設定</button>
      </div>

      {isMobile ? (
        tab==="timeline" ? TimelinePanel :
        tab==="today" ? TodayListPanel :
        tab==="later" ? LaterPanel : EditPanel
      ) : (
        tab==="later" ? <div style={S.grid}>{LaterPanel}{TodayListPanel}</div> :
        tab==="edit" ? <div style={S.grid}>{EditPanel}{TodayListPanel}</div> :
        <div style={S.grid}>{TodayListPanel}{TimelinePanel}</div>
      )}

      {timer&&(
        <div style={{...S.timerCard,background:timer.phase==="focus"?"linear-gradient(135deg,#3C2D2A,#5A4540)":"linear-gradient(135deg,#5BA199,#4A857E)"}}>
          <div style={S.timerTop}>
            <span style={S.timerPhase}>{timer.phase==="focus"?"🍅 集中中":timer.phase==="long"?"🌴 長休憩":"☕ 小休憩"}</span>
            <button style={S.timerClose} onClick={()=>setTimer(null)}>✕</button>
          </div>
          <div style={S.timerTitle}>{timer.title}</div>
          <div style={S.timerClock}>{String(Math.floor(timer.secs/60)).padStart(2,"0")}:{String(timer.secs%60).padStart(2,"0")}</div>
          <div style={S.timerBarBg}><div style={{...S.timerBarFill,width:`${(1-timer.secs/timer.total)*100}%`}}/></div>
          <div style={S.timerFooter}><span>完了: {timer.pomoDone} 🍅</span><button style={S.timerPause} onClick={()=>setTimer(tm=>({...tm,paused:!tm.paused}))}>{timer.paused?"▶ 再開":"⏸ 停止"}</button></div>
        </div>
      )}
      <footer style={S.footer}>DailyFlow — クラウド同期 × ポモドーロ × 24時間タイムライン</footer>
    </div>
  );
}

function TaskCard({t,onUpdate,onRemove,pomoLayout,onLater}){
  const [editDur,setEditDur]=useState(false);
  const p=PALETTE[t.color];
  const pc=t.usePomo?pomoLayout(t.duration).pomoCount:0;
  const setDur = v => onUpdate(t.id,{duration:Math.max(5,v),autoDuration:false});
  return(
    <div style={{...S.card,opacity:t.done?0.5:1,borderLeft:`4px solid ${p.bar}`}}>
      <button style={{...S.check,background:t.done?p.bar:"transparent",borderColor:p.bar}} onClick={()=>onUpdate(t.id,{done:!t.done})}>{t.done?"✓":""}</button>
      <div style={{flex:1,minWidth:0}}>
        <input value={t.title} onChange={e=>onUpdate(t.id,{title:e.target.value})} style={{...S.cardTitle,textDecoration:t.done?"line-through":"none"}}/>
        <div style={S.cardMeta}>
          <div style={S.prioGroup}>
            {Object.entries(PRIORITY).map(([k,v])=>(
              <button key={k} onClick={()=>onUpdate(t.id,{priority:k})} style={{...S.prioBtn,background:t.priority===k?v.color:"#fff",color:t.priority===k?"#fff":"#9A918C",borderColor:t.priority===k?v.color:"#E5DDD5"}}>{v.label}</button>
            ))}
          </div>
          <div style={S.durControl}>
            <button style={S.durStep} onClick={()=>setDur(t.duration-60)}>−1h</button>
            <button style={S.durStep} onClick={()=>setDur(t.duration-15)}>−15</button>
            {editDur?(
              <input type="number" min={5} step={5} value={t.duration} autoFocus onChange={e=>setDur(Number(e.target.value)||5)} onBlur={()=>setEditDur(false)} onKeyDown={e=>e.key==="Enter"&&setEditDur(false)} style={S.durInput}/>
            ):(
              <button style={S.durChip} onClick={()=>setEditDur(true)}>{fmtDur(t.duration)}{t.autoDuration&&<span style={S.autoTag}>自動</span>}</button>
            )}
            <button style={S.durStep} onClick={()=>setDur(t.duration+15)}>＋15</button>
            <button style={S.durStep} onClick={()=>setDur(t.duration+60)}>＋1h</button>
          </div>
          <button style={{...S.pomoToggle,background:t.usePomo?"#FDE2E4":"#fff",color:t.usePomo?"#7A2B3D":"#9A918C",borderColor:t.usePomo?"#E76F87":"#E5DDD5"}} onClick={()=>onUpdate(t.id,{usePomo:!t.usePomo})}>{t.usePomo?`🍅 ポモ${pc}回`:"🍅 分割OFF"}</button>
          <button style={{...S.fixBtn,background:t.fixed?"#3C2D2A":"#fff",color:t.fixed?"#fff":"#9A918C"}} onClick={()=>onUpdate(t.id,{fixed:!t.fixed,fixedStart:!t.fixed?t.fixedStart||"13:00":null})}>📌 固定</button>
          {t.fixed&&<input type="time" value={t.fixedStart||"13:00"} onChange={e=>onUpdate(t.id,{fixedStart:e.target.value})} style={S.fixTime}/>}
          <button style={S.laterMini} onClick={onLater}>🗂 あとで</button>
        </div>
      </div>
      <button style={S.del} onClick={()=>onRemove(t.id)}>✕</button>
    </div>
  );
}

function PomoField({label,unit,val,set}){
  return(<div style={S.pomoField}><label style={S.pomoLabel}>{label}</label><div style={S.pomoInputWrap}><input type="number" min={1} value={val} onChange={e=>set(Math.max(1,Number(e.target.value)||1))} style={S.pomoInput}/><span style={S.pomoUnit}>{unit}</span></div></div>);
}
function Stat({label,value,warn}){
  return(<div style={S.statItem}><div style={{...S.statVal,color:warn?"#E76F87":"#3C2D2A"}}>{value}</div><div style={S.statLabel}>{label}</div></div>);
}
